name: Importar fotos de la web actual

# Descarga las fotos y los textos de www.cocinascma.com, los guarda en el
# repositorio (src/assets/fotos/web-actual, src/data/fotos-web-actual.json y
# referencias/web-actual) y vuelve a publicar la web.
# Se lanza a mano: Actions → "Importar fotos de la web actual" → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Importar fotos y textos
        run: npm run fotos

      - name: Guardar en el repositorio
        id: guardar
        run: |
          git add -A src/assets/fotos/web-actual src/data/fotos-web-actual.json referencias/web-actual
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
            echo "cambios=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Importar fotos y textos de la web actual (cocinascma.com)"
          git push
          echo "cambios=true" >> "$GITHUB_OUTPUT"

      # Los commits hechos con el token de Actions no disparan otros workflows,
      # así que lanzamos la publicación explícitamente.
      - name: Volver a publicar la web
        if: steps.guardar.outputs.cambios == 'true'
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
